{% include base_path %}
<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
(function() {
  // Dropdown menu functionality
  function initDropdowns() {
    // Main dropdown toggle
    var dropdownToggles = document.querySelectorAll('.dropdown-toggle');
    for (var i = 0; i < dropdownToggles.length; i++) {
      dropdownToggles[i].addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var parent = this.parentElement;
        var isOpen = parent.classList.contains('open');
        // Close all dropdowns first
        var openDropdowns = document.querySelectorAll('.dropdown.open');
        for (var j = 0; j < openDropdowns.length; j++) {
          openDropdowns[j].classList.remove('open');
        }
        var openSubmenus = document.querySelectorAll('.dropdown-submenu.open');
        for (var j = 0; j < openSubmenus.length; j++) {
          openSubmenus[j].classList.remove('open');
        }
        // Toggle this one
        if (!isOpen) {
          parent.classList.add('open');
        }
      });
    }

    // Submenu toggle
    var submenuToggles = document.querySelectorAll('.submenu-toggle');
    for (var i = 0; i < submenuToggles.length; i++) {
      submenuToggles[i].addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var parent = this.parentElement;
        // Close sibling submenus
        var siblings = parent.parentElement.querySelectorAll('.dropdown-submenu.open');
        for (var j = 0; j < siblings.length; j++) {
          if (siblings[j] !== parent) {
            siblings[j].classList.remove('open');
          }
        }
        parent.classList.toggle('open');
      });
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown')) {
        var openDropdowns = document.querySelectorAll('.dropdown.open');
        for (var j = 0; j < openDropdowns.length; j++) {
          openDropdowns[j].classList.remove('open');
        }
        var openSubmenus = document.querySelectorAll('.dropdown-submenu.open');
        for (var j = 0; j < openSubmenus.length; j++) {
          openSubmenus[j].classList.remove('open');
        }
      }
    });
  }

  // Run when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDropdowns);
  } else {
    initDropdowns();
  }
})();
</script>
